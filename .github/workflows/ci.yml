name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: 0 0 * * 0

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        version:
          - stable
          - 1.61.0 # MSRV

    name: ${{ matrix.version }}
    runs-on: ubuntu-latest

    steps:
      - name: checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ matrix.version }}

      - name: install cargo-hack
        uses: taiki-e/install-action@750514b48f677a9e52f0eab29937a9027b38a7a7 # cargo-hack

      - name: install cargo-nextest
        uses: taiki-e/install-action@750514b48f677a9e52f0eab29937a9027b38a7a7 # cargo-nextest

      - name: test
        run: cargo hack --feature-powerset nextest run --workspace

  linting:
    if: ${{ github.ref != 'main' }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with: { components: rustfmt, clippy }

      - name: format
        run: cargo fmt --all -- --check

      - name: clippy
        uses: giraffate/clippy-action@13b9d32482f25d29ead141b79e7e04e7900281e0 # v1.0.1
        with:
          clippy_flags: -- -D warnings
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check

  minimal-versions:
    runs-on: ubuntu-latest
    steps:
      - name: checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with: { toolchain: nightly }

      - name: install cargo-hack
        uses: taiki-e/install-action@750514b48f677a9e52f0eab29937a9027b38a7a7 # cargo-hack

      - name: install cargo-minimal-versions
        uses: taiki-e/install-action@750514b48f677a9e52f0eab29937a9027b38a7a7 # cargo-minimal-versions

      - name: minimal version check
        run: cargo minimal-versions check --workspace

  zizmor:
    name: GitHub Actions Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
